<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
  <meta charset="UTF-8">
  <title>List of Recipes</title>
</head>
<body>
<h2 th:text="'List of Recipes'">Recipes</h2>
<table class="table table-striped">
  <thead>
  <tr>
    <th >ID</th>
    <th>description</th>
    =
  </tr>
  </thead>
  <tbody>
  <tr th:each="recipe : ${recipes}">
    <td th:text="${recipe?.id}">1</td>
    <td th:text="${recipe?.description}">A</td>
  </tr>
  </tbody>
</table>
</body>
</html>
